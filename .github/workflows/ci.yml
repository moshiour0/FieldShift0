name: FieldShift CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -U pip
      - run: python -m pip install -e .[dev,api]
      - run: FIELD_SHIFT_LIVE_NASA=0 python -m pytest -q
      - run: python -m compileall -q src
      - run: python -m ruff check src/fieldshift/v3 src/fieldshift/api tests_v3
      - run: python -m mypy src/fieldshift/v3 src/fieldshift/api
