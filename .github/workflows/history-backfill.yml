name: Backfill nine-region NASA POWER daily history
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: First completed year to archive (2016 or later)
        required: true
        type: number
        default: 2016
      end_year:
        description: Last completed year to archive (must be before the current year)
        required: true
        type: number
        default: 2025

permissions:
  contents: read
  id-token: write

concurrency:
  group: fieldshift-power-history-backfill
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify archive prerequisites
    runs-on: ubuntu-latest
    steps:
      - name: Require durable storage and validate the year window
        env:
          ARCHIVE_BUCKET: ${{ vars.FIELD_SHIFT_ARCHIVE_S3_BUCKET }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          set -euo pipefail
          if [[ -z "$ARCHIVE_BUCKET" || -z "$AWS_ROLE_ARN" ]]; then
            echo "::error title=Archive infrastructure missing::Set the repository Variables FIELD_SHIFT_ARCHIVE_S3_BUCKET and AWS_ROLE_ARN before running a historical backfill. No NASA data request was started."
            exit 1
          fi
          if ! [[ "$START_YEAR" =~ ^[0-9]{4}$ && "$END_YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "::error::Years must be four-digit calendar years."
            exit 1
          fi
          current_year="$(date -u +%Y)"
          if (( START_YEAR < 2016 || END_YEAR < START_YEAR || END_YEAR >= current_year || END_YEAR - START_YEAR > 29 )); then
            echo "::error::Select completed calendar years from 2016 onward, in ascending order, with a maximum 30-year window."
            exit 1
          fi
          {
            echo "## NASA POWER historical archive"
            echo "- Requested years: $START_YEAR–$END_YEAR"
            echo "- Destination: configured S3 bucket, prefix power-history/{region}/{year}.json"
            echo "- Regions: all nine configured representative points"
            echo "- Parallel region workers: 3"
            echo "- Existing checksum-valid year files are reused; failed/missing years can be retried."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Assume archive role and verify S3 read/write before NASA access
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      - name: Verify S3 archive permissions
        env:
          ARCHIVE_BUCKET: ${{ vars.FIELD_SHIFT_ARCHIVE_S3_BUCKET }}
        run: |
          set -euo pipefail
          probe_key="power-history/_preflight/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'FieldShift archive preflight %s %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > /tmp/fieldshift-s3-probe.txt
          aws s3api put-object --bucket "$ARCHIVE_BUCKET" --key "$probe_key" --body /tmp/fieldshift-s3-probe.txt --server-side-encryption AES256 >/dev/null
          aws s3api get-object --bucket "$ARCHIVE_BUCKET" --key "$probe_key" /tmp/fieldshift-s3-probe-readback.txt >/dev/null
          cmp /tmp/fieldshift-s3-probe.txt /tmp/fieldshift-s3-probe-readback.txt
          echo "S3 PutObject/GetObject preflight passed. Probe retained at s3://$ARCHIVE_BUCKET/$probe_key." >> "$GITHUB_STEP_SUMMARY"

  ingest:
    name: Archive ${{ matrix.region }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        region:
          - mymensingh
          - dhaka
          - rajshahi
          - rangpur
          - khulna
          - barishal
          - sylhet
          - chattogram
          - rangamati
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install archive dependencies
        run: python -m pip install -e '.[production]'
      - name: Assume least-privilege S3 archive role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      - name: Fetch, quality-check and publish completed daily years
        env:
          FIELD_SHIFT_ARCHIVE_S3_BUCKET: ${{ vars.FIELD_SHIFT_ARCHIVE_S3_BUCKET }}
          REGION: ${{ matrix.region }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          set -euo pipefail
          python scripts/prefetch_history.py --regions "$REGION" --start-year "$START_YEAR" --end-year "$END_YEAR" --pause 2
      - name: Record region result
        if: always()
        env:
          REGION: ${{ matrix.region }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## $REGION"
            echo "- Requested years: $START_YEAR–$END_YEAR"
            echo "- Job result: $JOB_STATUS"
            echo "- S3 key prefix: power-history/$REGION/"
          } >> "$GITHUB_STEP_SUMMARY"
